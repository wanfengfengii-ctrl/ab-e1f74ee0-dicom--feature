# DICOM strict frame extraction service.
#
#   APP_PORT  host port published for the API (defaults to 8080); the API
#             container listens on the same port number internally.
#
# Start the API:
#   docker compose up --build api
#
# One-shot verification (waits for the API to become healthy, then runs unit
# tests, an application build check and valid/bad-BOT API smoke tests; the
# exit code is the verify service's exit code):
#   docker compose up --build --abort-on-container-exit --exit-code-from verify

services:
  api:
    build: .
    image: dicom-frames:latest
    environment:
      APP_PORT: ${APP_PORT:-8080}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.environ['APP_PORT']+'/health', timeout=2).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  verify:
    image: dicom-frames:latest
    build:
      context: .
    command: ["python", "scripts/verify.py"]
    environment:
      APP_PORT: ${APP_PORT:-8080}
      API_BASE_URL: http://api:${APP_PORT:-8080}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
